# Full production-optimized stack. Optimized builds, no hot reload/bind
# mounts — a code change needs `up -d --build <service>`. nginx is the only
# publicly reachable service (port 8080); everything else is internal-only.
#
# Needs --env-file (see Usage) — several services here have no env_file: of
# their own and are filled in via ${VAR} substitution from it instead.
#
# Usage (run from nbe-financial-advisor-backend/deploy):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build <service>   # redeploy one
#   docker compose -f docker-compose.prod.yml down          # keep data
#   docker compose -f docker-compose.prod.yml down -v       # wipe data too

name: nbe-financial-advisor-prod

services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"                     # changed from 80 (already in use on this host)
    depends_on: [frontend, backend, backend-events]

  frontend:
    build:
      context: ../../nbe-financial-advisor-frontend
      dockerfile: Dockerfile.prod
    expose: ["80"]                    # internal only

  backend:
    build:
      context: ..
      args:
        BUILD_ENV: production
    # --worker-class gthread --timeout 0: left over from when this process
    # also served GET /events/stream directly (a long-lived connection would
    # otherwise get SIGKILL'd by gunicorn's default 30s request timeout).
    # That route now runs on the isolated backend-events service below
    # instead (nginx.conf's /api/events/ location points there, not here) —
    # kept here too as harmless headroom rather than reverting it, since
    # nothing about this service's normal request/response endpoints needs
    # gunicorn's default timeout enforced.
    # AUTO_SEED_DB opts a deploy into seeding synthetic products/investment
    # instruments/seed_user_* accounts on startup — off by default so a real
    # production deploy using this same compose file never seeds fake data
    # by accident. --if-empty makes it a one-time bootstrap rather than a
    # flush-and-reseed on every restart (see core/management/commands/
    # seed_db.py): it no-ops once any Product row exists, real or seeded, so
    # a running deployment's data (including whatever a seed user has done
    # since) survives every subsequent container restart. --force is still
    # required alongside it for the one run where it actually seeds, since
    # this compose's DJANGO_DEBUG defaults to 0.
    command: >
      sh -c "python manage.py migrate &&
            python manage.py ensure_storage_buckets &&
            python manage.py seed_onboarding_templates &&
            if [ \"$$AUTO_SEED_DB\" = \"1\" ]; then python manage.py seed_db --if-empty --force; fi &&
            gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 4 --timeout 0"
    environment:
      AUTO_SEED_DB: ${AUTO_SEED_DB:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      USE_MOCK_AI_SERVICE: ${USE_MOCK_AI_SERVICE:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # nginx.conf mounts this service at /api/ (stripping the prefix before
      # forwarding) — tells drf-spectacular's schema to prefix Swagger UI/
      # Redoc's "Try it out" requests the same way, or they 404/hit the
      # frontend's catch-all instead of this service.
      API_URL_PREFIX: /api
      # Deploy's own root .env gets baked into this image at build time
      # (Dockerfile's COPY . .), which would otherwise silently leak in the
      # dev value (:5173) — explicit override here to the address nginx
      # actually serves the frontend on in this stack.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Same reasoning as FRONTEND_URL above — GMAIL_*/DJANGO_CORS_ALLOWED_ORIGINS
      # have no compose default, so without an explicit line here they'd
      # silently fall back to whatever's baked into this image's own
      # nbe-financial-advisor-backend/.env (Dockerfile's COPY . .) instead of
      # this stack's --env-file.
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      # Holdings valuation uses the same normalized, replaceable quote gateway
      # as the advisor. When disabled, holdings stay editable but no quote
      # request is made.
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:?Set MARKET_DATA_ENABLED to 0 or 1}
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-http://market-data-gateway:8004}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_TIMEOUT_SECONDS: ${MARKET_DATA_TIMEOUT_SECONDS:-12}
      MARKET_DATA_CACHE_TTL_SECONDS: ${MARKET_DATA_CACHE_TTL_SECONDS:-60}
      # Consumed by core/migrations/0009_grant_ai_readonly_role.py to
      # provision/refresh the ai_readonly role's password.
      AI_READONLY_PASSWORD: ${AI_READONLY_PASSWORD:-change-me-readonly-pass}
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEED_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:-dev-seaweed-key}
      SEAWEED_SECRET_KEY: ${SEAWEED_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      # Mock bank OAuth+OTP identity provider + ledger (mock-bank-oauth/,
      # mock-bank-sync/, in-repo) — reached by service name inside this
      # compose network, same as ai-service above.
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_CLIENT_ID: ${MOCK_BANK_OAUTH_CLIENT_ID:-nbe-backend}
      MOCK_BANK_OAUTH_CLIENT_SECRET: ${MOCK_BANK_OAUTH_CLIENT_SECRET}
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:8080/bank-connect/callback}
      # Browser-facing address for the authorize_url handed to the frontend
      # (services/bank_connectors/mock_bank.py's get_authorize_url()) —
      # routed through nginx's /authorize, /login/ locations (nginx.conf),
      # so this is the same public origin as the frontend itself, not
      # mock-bank-oauth's internal container address.
      MOCK_BANK_OAUTH_PUBLIC_URL: ${MOCK_BANK_OAUTH_PUBLIC_URL:-http://localhost:8080}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      BANK_SYNC_WEBHOOK_SECRET: ${BANK_SYNC_WEBHOOK_SECRET}
    expose: ["8000"]                  # internal only — reached via nginx /api/
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated worker pool for the single multiplexed SSE connection
  # (core/views/events.py's POST /events/ticket + GET /events/stream), split
  # off from `backend` so a pile-up of open, long-lived streams (many
  # browser tabs, a reconnect storm, a slow client) can never starve
  # `backend`'s own thread pool the way it did when both shared it — every
  # other request (dashboard, transactions, chat, ...) stayed queued behind
  # open streams because backend's 2 workers x 4 threads is only 8 slots
  # total. Same image as `backend` (no migrate/seed step here — `backend`
  # already runs those against the same database on startup). Routed to by
  # nginx.conf's /api/events/ location instead of `backend` directly.
  backend-events:
    build:
      context: ..
      args:
        BUILD_ENV: production
    # 1 worker, many threads (not more workers): these connections are pure
    # I/O wait on a Redis pub/sub read (services/event_bus.py's
    # stream_user_events), not CPU work, so threads are cheap here and one
    # process is enough. 30 threads comfortably covers far more concurrent
    # streams than backend's old shared pool ever could.
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8010
      --worker-class gthread --workers 1 --threads 30 --timeout 0
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      USE_MOCK_AI_SERVICE: ${USE_MOCK_AI_SERVICE:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      API_URL_PREFIX: /api
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      AI_READONLY_PASSWORD: ${AI_READONLY_PASSWORD:-change-me-readonly-pass}
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEED_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:-dev-seaweed-key}
      SEAWEED_SECRET_KEY: ${SEAWEED_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_CLIENT_ID: ${MOCK_BANK_OAUTH_CLIENT_ID:-nbe-backend}
      MOCK_BANK_OAUTH_CLIENT_SECRET: ${MOCK_BANK_OAUTH_CLIENT_SECRET}
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:8080/bank-connect/callback}
      MOCK_BANK_OAUTH_PUBLIC_URL: ${MOCK_BANK_OAUTH_PUBLIC_URL:-http://localhost:8080}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      BANK_SYNC_WEBHOOK_SECRET: ${BANK_SYNC_WEBHOOK_SECRET}
    expose: ["8010"]                  # internal only — reached via nginx /api/events/
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      args:
        BUILD_ENV: production
    command: sh -c "celery -A config worker --loglevel=info --concurrency=2"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      USE_MOCK_AI_SERVICE: ${USE_MOCK_AI_SERVICE:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # See backend's own block above — GMAIL_*/DJANGO_CORS_ALLOWED_ORIGINS
      # have no compose default, so this process (which also loads
      # config.settings at import time) needs them wired explicitly too, or
      # it'd silently fall back to whatever's baked into this image's own
      # nbe-financial-advisor-backend/.env instead of this stack's --env-file.
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      AI_READONLY_PASSWORD: ${AI_READONLY_PASSWORD:-change-me-readonly-pass}
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEED_ACCESS_KEY: ${SEAWEED_ACCESS_KEY}
      SEAWEED_SECRET_KEY: ${SEAWEED_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      # See backend's mock-bank-oauth/mock-bank-sync block above — same
      # reasoning as AI_SERVICE_URL above (this process also loads
      # config.settings, core/tasks/bank_sync.py runs here).
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_CLIENT_ID: ${MOCK_BANK_OAUTH_CLIENT_ID:-nbe-backend}
      MOCK_BANK_OAUTH_CLIENT_SECRET: ${MOCK_BANK_OAUTH_CLIENT_SECRET}
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:8080/bank-connect/callback}
      MOCK_BANK_OAUTH_PUBLIC_URL: ${MOCK_BANK_OAUTH_PUBLIC_URL:-http://localhost:8002}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      BANK_SYNC_WEBHOOK_SECRET: ${BANK_SYNC_WEBHOOK_SECRET}
    # Overrides the image's baked-in HEALTHCHECK (Dockerfile hits
    # localhost:8000/health/, which nothing serves here) with a
    # Celery-native worker ping — same fix as docker-compose.dev.yml's
    # celery-worker service.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mock bank OAuth+OTP identity provider (mock-bank-oauth/README.md). No
  # build args: this service's Dockerfile has no dev/prod variant.
  #
  # Publicly reachable via nginx's /authorize + /login/ locations
  # (nginx.conf) rather than a published port — same internal-only +
  # nginx-fronted shape as backend's /api/, kept consistent with
  # MOCK_BANK_OAUTH_PUBLIC_URL above.
  mock-bank-oauth:
    build:
      context: ../mock-bank-oauth
    environment:
      MOCK_BANK_OAUTH_CLIENT_ID: ${MOCK_BANK_OAUTH_CLIENT_ID:-nbe-backend}
      MOCK_BANK_OAUTH_CLIENT_SECRET: ${MOCK_BANK_OAUTH_CLIENT_SECRET}
      MOCK_BANK_OAUTH_GMAIL_ADDRESS: ${MOCK_BANK_OAUTH_GMAIL_ADDRESS}
      MOCK_BANK_OAUTH_GMAIL_APP_PASSWORD: ${MOCK_BANK_OAUTH_GMAIL_APP_PASSWORD}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      MOCK_BANK_INTERNAL_SECRET: ${MOCK_BANK_INTERNAL_SECRET}
      MOCK_BANK_JWT_SECRET: ${MOCK_BANK_JWT_SECRET}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:8080}
      # Debug-only OTP reader — off by default (unlike the dev stack, which
      # turns it on). Leave off here; flip on only for a deliberate,
      # temporary debugging session.
      MOCK_BANK_OAUTH_ENABLE_DEBUG_ENDPOINTS: ${MOCK_BANK_OAUTH_ENABLE_DEBUG_ENDPOINTS:-0}
    expose: ["8002"]                  # internal only for now — see note above

  # Mock bank ledger (mock-bank-sync/README.md) — owns its own logical
  # database (mock_bank_db) on the SAME shared postgres service above,
  # provisioned by initdb/20-mock-bank-roles.sh. Purely server-to-server
  # (webhook target + JWT-verified account/transaction reads), so unlike
  # mock-bank-oauth this one has no public-reachability gap: internal-only
  # is correct as-is.
  mock-bank-sync:
    build:
      context: ../mock-bank-sync
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MOCK_BANK_DB_NAME: ${MOCK_BANK_DB_NAME:-mock_bank_db}
      MOCK_BANK_DB_USER: ${MOCK_BANK_DB_USER:-mock_bank_user}
      MOCK_BANK_DB_PASSWORD: ${MOCK_BANK_DB_PASSWORD:-mock_bank_db_pass}
      MOCK_BANK_INTERNAL_SECRET: ${MOCK_BANK_INTERNAL_SECRET}
      # Must match mock-bank-oauth's value above — this service verifies the
      # JWTs mock-bank-oauth signs, independently, with no network round trip.
      MOCK_BANK_JWT_SECRET: ${MOCK_BANK_JWT_SECRET}
      BACKEND_WEBHOOK_URL: http://backend:8000/webhooks/bank-sync/
      BANK_SYNC_WEBHOOK_SECRET: ${BANK_SYNC_WEBHOOK_SECRET}
    expose: ["8003"]                  # internal only — Pattern A
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    expose: ["6379"]                  # internal only — Pattern A
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional public-source implementation of the normalized market quote API.
  # It performs no source requests unless called. MARKET_DATA_BASE_URL can point
  # ai-service at an approved internal replacement without changing planner code.
  market-data-gateway:
    build:
      context: ../../nbe-financial-advisor-ai-service
      target: prod
    command: uvicorn app.market_data_gateway.main:app --host 0.0.0.0 --port 8004
    environment:
      MARKET_GATEWAY_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_GATEWAY_NBE_BASE_URL: ${MARKET_DATA_NBE_BASE_URL:-https://www.nbe.com.eg}
      MARKET_GATEWAY_NBE_EXCHANGE_PATH: ${MARKET_DATA_NBE_EXCHANGE_PATH:-/NBEeChannelManager/CallMW.aspx}
      MARKET_GATEWAY_GOLD_BASE_URL: ${MARKET_DATA_GOLD_BASE_URL:-https://api.gold-api.com}
      MARKET_GATEWAY_GOLD_QUOTE_PATH: ${MARKET_DATA_GOLD_QUOTE_PATH:-/price/XAU}
      MARKET_GATEWAY_FUND_BASE_URL: ${MARKET_DATA_FUND_BASE_URL:-https://english.mubasher.info}
      MARKET_GATEWAY_FUND_QUOTE_PATH: ${MARKET_DATA_FUND_QUOTE_PATH:-/markets/EGX/stocks/EGX30ETF}
      MARKET_GATEWAY_TIMEOUT_SECONDS: ${MARKET_DATA_SOURCE_TIMEOUT_SECONDS:-10}
    expose: ["8004"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: ../../nbe-financial-advisor-ai-service
      target: prod
    # Alembic runs AFTER backend is healthy => Django's tables already exist.
    # M7 hardening: upgrade depends_on to a dedicated backend-migrate one-shot
    # service with condition: service_completed_successfully for a hard guarantee.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"
    environment:
      # Own (read-write) database — a SEPARATE database (ai_appdb) owned by a
      # dedicated least-privilege role. The AI service migrates & owns these
      # tables; it holds NO superuser creds and cannot touch Django's appdb.
      #
      # Names below use the AI_SERVICE_<GROUP>__<FIELD> scheme required by
      # this service's own app/core/config.py (pydantic-settings,
      # env_prefix="AI_SERVICE_", env_nested_delimiter="__") — see that
      # repo's .env.example. The flat names this block used before (e.g.
      # POSTGRES_DB, USE_MOCK_MINERU) are NOT read by that Settings class at
      # all; they silently did nothing.
      AI_SERVICE_OWN_DB__POSTGRES_HOST: postgres
      AI_SERVICE_OWN_DB__POSTGRES_PORT: 5432
      AI_SERVICE_OWN_DB__POSTGRES_DB: ${AI_DB_NAME:-ai_appdb}
      AI_SERVICE_OWN_DB__POSTGRES_USER: ${AI_DB_USER:-ai_user}
      AI_SERVICE_OWN_DB__POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-ai_db_pass}
      # Backend (Django-owned) database — READ-ONLY role, SELECT only.
      # Same Postgres server, but appdb via a locked-down role so writes are
      # rejected by the DB itself.
      AI_SERVICE_BACKEND_DB__HOST: postgres
      AI_SERVICE_BACKEND_DB__PORT: 5432
      AI_SERVICE_BACKEND_DB__NAME: ${POSTGRES_DB:-appdb}
      AI_SERVICE_BACKEND_DB__USER: ai_readonly
      AI_SERVICE_BACKEND_DB__PASSWORD: ${AI_READONLY_PASSWORD:-change-me-readonly-pass}
      AI_SERVICE_CHAT_MODEL__USE_MOCK: ${USE_MOCK_LLM:-1}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      AI_SERVICE_CHAT_MODEL__OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_SERVICE_CHAT_MODEL__OPENAI_API_KEY: ${OPENAI_API_KEY:-__mock__}
      AI_SERVICE_CHAT_MODEL__MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      AI_SERVICE_CHAT_MODEL__NORMALIZATION_MAX_PARALLEL_CHUNKS: ${NORMALIZATION_MAX_PARALLEL_CHUNKS:-1}
      AI_SERVICE_CHAT_MODEL__NORMALIZATION_CHUNK_MAX_TOKENS: ${NORMALIZATION_CHUNK_MAX_TOKENS:-4096}
      # S3-compatible object storage — same SeaweedFS gateway the backend
      # uses, reusing its already-provisioned SEAWEED_* credentials/env vars.
      AI_SERVICE_STORAGE__S3_BUCKET: ${AI_STORAGE_BUCKET:-pfm-statements-normalized}
      AI_SERVICE_STORAGE__S3_ENDPOINT_URL: http://seaweedfs:8333
      AI_SERVICE_STORAGE__S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      AI_SERVICE_STORAGE__S3_ACCESS_KEY: ${SEAWEED_ACCESS_KEY}
      AI_SERVICE_STORAGE__S3_SECRET_KEY: ${SEAWEED_SECRET_KEY}
      AI_SERVICE_STORAGE__S3_USE_PATH_STYLE: "true"
      AI_SERVICE_STORAGE__S3_OCR_BUCKET: ${AI_STORAGE_OCR_BUCKET:-pfm-statements-ocr}
      # MinerU document processing — real service (mineru-server below) is
      # off by default; stays mocked until it's explicitly started.
      AI_SERVICE_MINERU__USE_MOCK: ${USE_MOCK_MINERU:-1}
      AI_SERVICE_MINERU__API_URL: ${MINERU_API_URL:-http://mineru-server:8000}
      AI_SERVICE_MINERU__API_KEY: ${MINERU_API_KEY:-key}
      AI_SERVICE_EMBEDDINGS__BASE_URL: ${EMBEDDING_BASE_URL}
      AI_SERVICE_EMBEDDINGS__API_KEY: ${EMBEDDING_API_KEY}
      AI_SERVICE_EMBEDDINGS__MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      AI_SERVICE_EMBEDDINGS__DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      # Optional curated market pricing. This controls only the quote capability,
      # not global AI-service network access. Production must choose 0 or 1.
      AI_SERVICE_MARKET_DATA__ENABLED: ${MARKET_DATA_ENABLED:?Set MARKET_DATA_ENABLED to 0 or 1}
      AI_SERVICE_MARKET_DATA__PROVIDER: ${MARKET_DATA_PROVIDER:-http}
      AI_SERVICE_MARKET_DATA__BASE_URL: ${MARKET_DATA_BASE_URL:-http://market-data-gateway:8004}
      AI_SERVICE_MARKET_DATA__API_KEY: ${MARKET_DATA_API_KEY:-}
      AI_SERVICE_MARKET_DATA__TIMEOUT_SECONDS: ${MARKET_DATA_TIMEOUT_SECONDS:-12}
      AI_SERVICE_MARKET_DATA__CACHE_TTL_SECONDS: ${MARKET_DATA_CACHE_TTL_SECONDS:-60}
      AI_SERVICE_MARKET_DATA__MAX_BATCH_SIZE: ${MARKET_DATA_MAX_BATCH_SIZE:-3}
      # Scope guardrail (zero-shot "is this about personal finance" check) — off
      # by default, still being validated. MODE=hosted calls the HF Inference API
      # (needs SCOPE_GUARD_HOSTED_API_KEY, a free token from
      # https://huggingface.co/settings/tokens); MODE=local runs the model
      # in-process instead (image must be built with `--group local-scope-guard`
      # first — not included by default, see the ai-service repo's pyproject.toml).
      AI_SERVICE_SCOPE_GUARD__ENABLED: ${SCOPE_GUARD_ENABLED:-0}
      AI_SERVICE_SCOPE_GUARD__MODE: ${SCOPE_GUARD_MODE:-hosted}
      AI_SERVICE_SCOPE_GUARD__HOSTED_API_KEY: ${SCOPE_GUARD_HOSTED_API_KEY}
    expose: ["8001"]                  # internal only, NEVER published — Pattern A
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      backend:
        condition: service_started    # backend starts (runs its migrate) before AI service

  # Real document-OCR engine (GPU-only). Off by default — start explicitly
  # with `docker compose -f docker-compose.prod.yml --profile api up -d mineru-server`,
  # then point AI_SERVICE_MINERU__USE_MOCK=0 at it.
  mineru-server:
    extends:
      file: ../../nbe-financial-advisor-ai-service/compose/mineru/docker-compose.yml
      service: mineru-api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      # Consumed by initdb/10-ai-roles.sh to provision ai_user + ai_appdb.
      # ai_readonly is provisioned separately by a Django migration (see
      # core/migrations/0009_grant_ai_readonly_role.py), which reads
      # AI_READONLY_PASSWORD from the backend service's own environment above.
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-change-me-ai-db-pass}
      # Consumed by initdb/20-mock-bank-roles.sh to provision
      # mock_bank_user + mock_bank_db (mock-bank-sync's own database).
      MOCK_BANK_DB_PASSWORD: ${MOCK_BANK_DB_PASSWORD:-mock_bank_db_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE on first cluster init: creates ai_user + ai_appdb (and, via
      # 20-mock-bank-roles.sh, mock_bank_user + mock_bank_db).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    # -s3/-filer are required for the S3 gateway to actually come up — without
    # them nothing listens on 8333 despite it being exposed below.
    # volumeSizeLimitMB intentionally shrunk from SeaweedFS's default-ish 1024
    # to 128: the master caps how many volumes it'll ever allocate at
    # free_disk_space / volumeSizeLimitMB (a worst-case reservation, not
    # actual usage), so on a disk-constrained host the larger limit starves
    # later buckets/collections of any volume at all long before real data
    # comes close to filling one. 128MB just means no single uploaded file
    # can exceed that — far above any bank-statement PDF (same fix applied
    # to docker-compose.dev.yml's seaweedfs service).
    command: "server -dir=/data -master.volumeSizeLimitMB=128 -filer -s3 -s3.port=8333"
    volumes:
      - seaweed_data:/data              # named volume — files persist across restarts
    expose:
      - "8333"                          # S3 API  (internal only — Pattern A)
      - "9333"                          # master
      - "8080"                          # volume server
    healthcheck:
      # 127.0.0.1, not localhost: this image's busybox wget resolves
      # "localhost" to ::1 first and doesn't fall back to IPv4, so the
      # healthcheck never passes if written the more obvious way.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── vLLM (PARKED — enable when a GPU machine is available) ──────────────
  # Serves the real model with an OpenAI-compatible API. Requires a GPU +
  # nvidia-container-toolkit on the host. Until then, the AI service uses
  # mock mode / OpenAI (USE_MOCK_LLM). Enabling this is CONFIG ONLY — no code changes.
  #
  # vllm:
  #   image: vllm/vllm-openai:latest        # ⚠️ PIN an exact tag/digest before real use
  #   command: ["--model", "${MODEL_NAME}"]  # e.g. a model that fits the GPU's VRAM
  #   volumes:
  #     - ./models:/models                   # pre-fetched weights (offline prod can't download)
  #   expose:
  #     - "8000"                             # internal only — never published (Pattern A)
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   healthcheck:
  #     test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 300s                   # weights take minutes to load

networks:
  default:
    name: nbe-prod

volumes:
  pgdata:
  seaweed_data:
  # models:                                  # uncomment with vllm service above
