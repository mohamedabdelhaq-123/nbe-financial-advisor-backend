# Full local-dev stack. Hot reload on backend/frontend/ai-service;
# celery-worker needs a manual restart after task code changes.
#
# Ports: frontend 5173, backend 8000, ai-service 8001, mock-bank-oauth 8002,
# mock-bank-sync 8003, postgres 5433, redis 6379, seaweedfs 8333/9333/8888,
# nginx 8080 (optional prod-like single-origin routing — every service above
# is also reachable directly; nginx here is a convenience, not required).
#
# Usage (run from nbe-financial-advisor-backend/deploy):
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down          # keep data
#   docker compose -f docker-compose.dev.yml down -v       # wipe data too
#
# `up --build` builds all 6 images in parallel by default. On a machine
# already under load this can starve BuildKit's own process and crash the
# build ("frontend grpc server closed unexpectedly"). If that happens, cap
# concurrency: COMPOSE_PARALLEL_LIMIT=2 docker compose -f docker-compose.dev.yml up -d --build

name: nbe-financial-advisor-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-change-me-ai-db-pass}
      MOCK_BANK_DB_PASSWORD: ${MOCK_BANK_DB_PASSWORD:-mock_bank_db_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -master.volumeSizeLimitMB=1024 -filer -s3 -s3.port=8333"
    volumes:
      - seaweed_data:/data
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      provenance: false
      sbom: false
      args:
        BUILD_ENV: development
    command: >
      sh -c "python manage.py migrate &&
            python manage.py ensure_storage_buckets &&
            python manage.py seed_onboarding_templates &&
            python manage.py seed_db &&
            if [ -n \"$SEED_MOCK_BANK_CUSTOMER_EMAIL\" ]; then python manage.py register_mock_bank_customer --email \"$SEED_MOCK_BANK_CUSTOMER_EMAIL\" || true; fi &&
            python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: 1
      USE_MOCK_AI_SERVICE: "0"
      AI_SERVICE_URL: http://ai-service:8001
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:5173/bank-connect/callback}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      SEED_MOCK_BANK_CUSTOMER_EMAIL: ${SEED_MOCK_BANK_CUSTOMER_EMAIL:-}
    volumes:
      - ..:/app
      - /app/.venv
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      provenance: false
      sbom: false
      args:
        BUILD_ENV: development
    command: sh -c "celery -A config worker --loglevel=info --concurrency=2"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: 1
      USE_MOCK_AI_SERVICE: "0"
      AI_SERVICE_URL: http://ai-service:8001
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:5173/bank-connect/callback}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
    volumes:
      - ..:/app
      - /app/.venv
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-bank-oauth:
    build:
      context: ../mock-bank-oauth
      provenance: false
      sbom: false
    env_file:
      - ../.env
    environment:
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      FRONTEND_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MOCK_BANK_OAUTH_ENABLE_DEBUG_ENDPOINTS: 1
    ports:
      - "8002:8002"

  mock-bank-sync:
    build:
      context: ../mock-bank-sync
      provenance: false
      sbom: false
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKEND_WEBHOOK_URL: http://backend:8000/webhooks/bank-sync/
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ../../nbe-financial-advisor-ai-service
      target: dev
      provenance: false
      sbom: false
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    env_file:
      - ../../nbe-financial-advisor-ai-service/.env
    volumes:
      - ../../nbe-financial-advisor-ai-service:/app
      - ai-service-dev-venv:/app/.venv
    ports:
      - "8001:8001"

  # Real document-OCR engine (GPU-only). Off by default — start explicitly
  # with `docker compose -f docker-compose.dev.yml --profile api up mineru-server`.
  # ai-service stays in mocked-MinerU mode (USE_MOCK_MINERU=1) until this is
  # up and AI_SERVICE_MINERU__API_URL/USE_MOCK are pointed at it.
  mineru-server:
    extends:
      file: ../../nbe-financial-advisor-ai-service/compose/mineru/docker-compose.yml
      service: mineru-api

  frontend:
    build:
      context: ../../nbe-financial-advisor-frontend
      dockerfile: Dockerfile.dev
      provenance: false
      sbom: false
    env_file:
      - ../../nbe-financial-advisor-frontend/.env
    volumes:
      - ../../nbe-financial-advisor-frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"

  # Optional prod-like single-origin routing (frontend + /api/ + /api/events/
  # behind one port), mirroring docker-compose.prod.yml's nginx but pointed
  # at the dev servers above (frontend:5173, backend:8000 — no backend-events
  # split here, same as prod's nginx.conf routes /api/events/ to
  # backend-events, this uses nginx.dev.conf which routes it to backend
  # directly, matching this stack having no backend-events service). Not
  # required for normal dev — every service's own port above still works.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [frontend, backend]

networks:
  default:
    name: nbe-dev

volumes:
  pgdata:
  seaweed_data:
  ai-service-dev-venv:
  frontend-node-modules:
