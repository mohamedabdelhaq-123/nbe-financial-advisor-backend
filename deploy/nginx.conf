server {
  listen 80;

  # nginx's own default (1m) rejects any bank statement PDF over ~1MB with a
  # 413 before the request ever reaches Django — raised generously above any
  # realistic statement size.
  client_max_body_size 20m;

  # SEC-006 — security headers. NOT set at server level: nginx's add_header
  # only inherits into a location that defines none of its own, and the two
  # groups below genuinely need different policies (see the mock-bank-oauth
  # locations further down), so each location sets its own full block
  # instead of relying on inheritance silently doing the wrong thing later
  # if one location ever grows its own add_header.
  #
  # proxy_hide_header first: both backend:8000 (Django's SecurityMiddleware/
  # XFrameOptionsMiddleware) and frontend:80 (its own nginx.frontend.conf,
  # same SEC-006 policy) already send some of these — appending nginx's own
  # on top without hiding the upstream ones first would send duplicate
  # headers with different values (verified by hand: Django defaults
  # Referrer-Policy to "same-origin", not the "strict-origin-when-cross-
  # origin" this policy uses — browsers are spec'd to take the last
  # Referrer-Policy value, so it'd technically still resolve correctly, but
  # sending two different values for the same header is exactly the kind of
  # inconsistency SEC-006 asked to avoid). This edge nginx is the single
  # source of truth for these headers on the response path a browser
  # actually sees.
  #
  # No Strict-Transport-Security here: no TLS termination is configured in
  # this file (`listen 80` only) — HSTS is a no-op without HTTPS and
  # premature to add before TLS is actually in place. Add it once
  # `listen 443 ssl` (with real certificates) is configured, or once
  # external TLS termination (load balancer/CDN) is confirmed.

  # frontend SPA
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # OpenAPI docs/schema/redoc — passed through with the /api/ prefix intact,
  # unlike /api/ below (which strips it). These pages embed a browser-
  # fetchable link back to the schema (reverse()'d from Django's own urlconf,
  # which registers these three routes WITH "api/" baked in for exactly this
  # reason — config/urls.py) that the browser re-requests as an independent
  # second hop; stripping the prefix here would 404 that follow-up request
  # (nginx matches the longest prefix location regardless of block order, so
  # these take precedence over /api/ below without needing regex).
  location /api/schema/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location /api/docs/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location /api/redoc/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # backend API — strip the /api prefix before forwarding
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # SSE (single multiplexed connection, core/views/events.py) — long-lived,
  # so buffering/caching must be off or events queue up instead of
  # streaming, and the read timeout needs to be long, not nginx's default.
  # nginx matches the longest prefix location regardless of block order, so
  # this takes precedence over /api/ above for anything under /api/events/.
  # Routed to backend-events (docker-compose.yml), a worker pool isolated
  # from `backend`'s, so a pile-up of open streams can't starve the rest of
  # the API's thread pool the way it used to when both shared it.
  location /api/events/ {
    proxy_pass http://backend-events:8010/events/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # NOTE: no /ai route on purpose — the AI service stays private (Pattern A)
  # It is only reachable by the backend container via the Docker network.

  # Mock bank OAuth+OTP identity provider (mock-bank-oauth/) — the browser is
  # sent here directly (services/bank_connectors/mock_bank.py's
  # get_authorize_url(), MOCK_BANK_OAUTH_PUBLIC_URL), unlike backend/ai-service
  # above which are only ever called server-to-server. Routed at root level,
  # NOT under a stripped prefix like /api/ — /authorize's served HTML posts
  # to absolute root paths (<form action="/login/start">, "/login/verify">),
  # so the paths here must match exactly what mock-bank-oauth itself expects.
  # SEC-006 note for all three mock-bank-oauth locations below: deliberately
  # NOT setting X-Frame-Options or Content-Security-Policy here, unlike
  # every other location in this file. mock-bank-oauth/app/main.py already
  # sets its own Content-Security-Policy: frame-ancestors on every response
  # (see that file's add_frame_ancestors_csp middleware) specifically so the
  # frontend can embed its login pages in an iframe/modal — CSP headers
  # don't merge, multiple ones get intersected to the most restrictive, so
  # adding this file's normal frame-ancestors 'none' here would silently
  # override mock-bank-oauth's own intentional policy. X-Frame-Options:
  # DENY would fight the same intent for browsers that honor it over CSP.
  # The other three headers (no framing implications) are still added.
  location /authorize {
    proxy_pass http://mock-bank-oauth:8002/authorize;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
  }

  location /login/ {
    proxy_pass http://mock-bank-oauth:8002/login/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
  }

  # Debug-only OTP reader (app/routes_debug.py) — off server-side by default
  # here (MOCK_BANK_OAUTH_ENABLE_DEBUG_ENDPOINTS defaults to 0 in
  # docker-compose.yml), so this route existing is harmless until someone
  # deliberately flips that on for a debugging session.
  location /debug/ {
    proxy_pass http://mock-bank-oauth:8002/debug/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
  }

  # mock-bank-sync's /simulate/* (app/routes_simulate.py) — dev-only
  # customer/transaction seeding endpoints, no auth required (unlike
  # /internal/customers/lookup, which mock-bank-oauth calls server-to-server
  # and stays unrouted here on purpose). Otherwise this service is purely
  # server-to-server (webhook target + JWT-verified reads), so /simulate/ is
  # the one deliberate exception to its normal internal-only reachability.
  location /simulate/ {
    proxy_pass http://mock-bank-sync:8003/simulate/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
