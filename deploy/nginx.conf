server {
  listen 80;

  # nginx's own default (1m) rejects any bank statement PDF over ~1MB with a
  # 413 before the request ever reaches Django — raised generously above any
  # realistic statement size.
  client_max_body_size 20m;

  # frontend SPA
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # OpenAPI docs/schema/redoc — passed through with the /api/ prefix intact,
  # unlike /api/ below (which strips it). These pages embed a browser-
  # fetchable link back to the schema (reverse()'d from Django's own urlconf,
  # which registers these three routes WITH "api/" baked in for exactly this
  # reason — config/urls.py) that the browser re-requests as an independent
  # second hop; stripping the prefix here would 404 that follow-up request
  # (nginx matches the longest prefix location regardless of block order, so
  # these take precedence over /api/ below without needing regex).
  location /api/schema/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/docs/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/redoc/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # backend API — strip the /api prefix before forwarding
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # SSE (single multiplexed connection, core/views/events.py) — long-lived,
  # so buffering/caching must be off or events queue up instead of
  # streaming, and the read timeout needs to be long, not nginx's default.
  # nginx matches the longest prefix location regardless of block order, so
  # this takes precedence over /api/ above for anything under /api/events/.
  location /api/events/ {
    proxy_pass http://backend:8000/events/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  # NOTE: no /ai route on purpose — the AI service stays private (Pattern A)
  # It is only reachable by the backend container via the Docker network.

  # Mock bank OAuth+OTP identity provider (mock-bank-oauth/) — the browser is
  # sent here directly (services/bank_connectors/mock_bank.py's
  # get_authorize_url(), MOCK_BANK_OAUTH_PUBLIC_URL), unlike backend/ai-service
  # above which are only ever called server-to-server. Routed at root level,
  # NOT under a stripped prefix like /api/ — /authorize's served HTML posts
  # to absolute root paths (<form action="/login/start">, "/login/verify">),
  # so the paths here must match exactly what mock-bank-oauth itself expects.
  location /authorize {
    proxy_pass http://mock-bank-oauth:8002/authorize;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /login/ {
    proxy_pass http://mock-bank-oauth:8002/login/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Debug-only OTP reader (app/routes_debug.py) — off server-side by default
  # here (MOCK_BANK_OAUTH_ENABLE_DEBUG_ENDPOINTS defaults to 0 in
  # docker-compose.yml), so this route existing is harmless until someone
  # deliberately flips that on for a debugging session.
  location /debug/ {
    proxy_pass http://mock-bank-oauth:8002/debug/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # mock-bank-sync's /simulate/* (app/routes_simulate.py) — dev-only
  # customer/transaction seeding endpoints, no auth required (unlike
  # /internal/customers/lookup, which mock-bank-oauth calls server-to-server
  # and stays unrouted here on purpose). Otherwise this service is purely
  # server-to-server (webhook target + JWT-verified reads), so /simulate/ is
  # the one deliberate exception to its normal internal-only reachability.
  location /simulate/ {
    proxy_pass http://mock-bank-sync:8003/simulate/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
