server {
  listen 80;

  # frontend SPA — Vite dev server (Dockerfile.dev), with HMR websocket support
  location / {
    proxy_pass http://frontend:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/schema/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/docs/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/redoc/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/events/ {
    proxy_pass http://backend:8000/events/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  # Mock bank OAuth+OTP identity provider (mock-bank-oauth/README.md) —
  # browser-facing login pages only (/token is server-to-server, reached
  # directly by backend/celery-worker via MOCK_BANK_OAUTH_SERVICE_URL, no
  # route needed here). No prefix stripping: the served HTML uses
  # absolute-root form actions (action="/login/start" etc, mock-bank-oauth's
  # own routes are mounted at root), so the request path must reach the
  # upstream unchanged — proxy_pass with no trailing path does that.
  location /authorize {
    proxy_pass http://mock-bank-oauth:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /login/ {
    proxy_pass http://mock-bank-oauth:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /debug/challenges/ {
    proxy_pass http://mock-bank-oauth:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
